<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ecebe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Not">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Not</title>
<style>
  :root { --paper: #ecebe4; --ink: #111; --mute: #555; --field: #fff; }
  @media (prefers-color-scheme: dark) { :root { --paper: #121212; --ink: #e9e7df; --mute: #9a9890; --field: #000; } }
  #q { margin-bottom: 12px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font: 17px/1.5 Georgia, "Times New Roman", serif;
    min-height: 100dvh; max-width: 640px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column;
  }
  .mono, .meta, header, #status, button, input, .tags i { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
  header b { font-size: 15px; letter-spacing: .3em; }
  header nav { display: flex; gap: 2px; margin-right: -10px; }
  [hidden] { display: none !important; }
  /* yazılı tuşlar: ince hap; simge tuşları: çerçevesiz, 44px dokunma alanı */
  button { background: none; color: var(--ink); border: 1px solid var(--ink); border-radius: 99px; font-size: 13px; letter-spacing: .04em; padding: 8px 16px; cursor: pointer; }
  button:active { background: var(--ink); color: var(--paper); }
  .ic { position: relative; width: 44px; height: 44px; padding: 0; border: 0; display: grid; place-items: center; color: var(--ink); }
  .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic:active { background: none; opacity: .45; }
  #sync[data-n]::after { content: attr(data-n); position: absolute; top: 3px; right: -3px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px;
    background: var(--ink); color: var(--paper); font-size: 10px; line-height: 15px; text-align: center; box-shadow: 0 0 0 2px var(--paper); }
  .busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ghost { border-color: transparent; color: var(--mute); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .stage { display: grid; place-items: center; gap: 18px; padding: 48px 0 36px; }
  #rec {
    width: min(56vw, 210px); aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--ink); padding: 0;
    display: grid; place-items: center; font-size: 15px; letter-spacing: .25em;
  }
  #rec::before { content: ""; width: 34%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); grid-area: 1/1; }
  #rec span { display: none; }
  .rec #rec { background: var(--ink); color: var(--paper); }
  .rec #rec::before { background: var(--paper); border-radius: 4px; width: 26%; }
  #status { min-height: 1.5em; font-size: 22px; letter-spacing: .1em; text-align: center; }
  .rec #status { font-size: 34px; }

  #list { border-top: 2px solid var(--ink); }
  #list details { border-bottom: 2px solid var(--ink); }
  #list summary { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px; cursor: pointer; list-style: none;
    font: 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .2em; text-transform: uppercase; }
  #list summary::-webkit-details-marker { display: none; }
  #list summary span:first-child::before { content: "+ "; }
  #list details[open] summary span:first-child::before { content: "− "; }
  #list ul { list-style: none; padding: 0 0 6px 14px; }
  #list li { border-top: 1px solid var(--ink); }
  .item { all: unset; display: grid; gap: 2px; width: 100%; padding: 14px 2px; cursor: pointer; }
  .item:focus-visible { outline: 3px solid var(--ink); }
  .meta { font-size: 12px; color: var(--mute); }
  .title { font-size: 19px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags i { font-style: normal; font-size: 11px; border: 1px solid var(--ink); padding: 1px 6px; text-transform: uppercase; letter-spacing: .08em; }
  .empty { padding: 24px 0; color: var(--mute); text-align: center; }

  dialog { margin: auto; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); padding: 0; width: min(100vw - 24px, 640px); max-height: calc(100dvh - 24px); }
  dialog::backdrop { background: var(--paper); opacity: .85; }
  .dbody { padding: 20px; overflow-y: auto; max-height: calc(100dvh - 110px); display: grid; gap: 12px; }
  .dbody h2 { font-size: 24px; line-height: 1.25; font-weight: normal; }
  .dbody h3 { font: 12px ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; border-top: 2px solid var(--ink); padding-top: 12px; }
  blockquote { border-left: 4px solid var(--ink); padding-left: 12px; font-style: italic; }
  .dbody ul { padding-left: 20px; }
  .text { white-space: pre-wrap; }
  .err { border: 2px dashed var(--ink); padding: 8px; font-size: 14px; }
  audio { width: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--ink); }
  .bar .push { margin-left: auto; }
  label { display: grid; gap: 4px; font-size: 13px; }
  input { font-size: 15px; padding: 10px; border: 1px solid var(--ink); background: var(--field); color: var(--ink); width: 100%; }
  .hint { font-size: 13px; color: var(--mute); }
  .hint a { color: var(--ink); }
  textarea { font: 15px/1.5 Georgia, serif; padding: 10px; border: 2px solid var(--ink); background: var(--field); color: var(--ink); width: 100%; resize: vertical; }
  .remind { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 2px solid var(--ink); padding: 10px; }
  .remind b { width: 100%; font-family: ui-monospace, monospace; font-size: 14px; }
  .btn { border: 1px solid var(--ink); border-radius: 99px; padding: 6px 14px; color: var(--ink); text-decoration: none; font: 13px ui-monospace, monospace; }
  .erow { display: flex; justify-content: space-between; align-items: center; }
  .mark { border-left: 4px double var(--ink); padding-left: 10px; }
  #mark { display: none; }
  .rec #mark { display: block; }
  .item.on { background: var(--ink); color: var(--paper); }
  .item.on .meta { color: var(--paper); }
  .item.on .tags i { border-color: var(--paper); }
  #selbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; gap: 8px; align-items: center; justify-content: space-between;
    padding: 12px 20px calc(env(safe-area-inset-bottom) + 12px); background: var(--paper); border-top: 3px solid var(--ink); }
  .sel #selbar { display: flex; }
  .sel { padding-bottom: 90px; }
  .sel #selbtn { background: var(--ink); color: var(--paper); border-radius: 50%; }
  fieldset { border: 2px solid var(--ink); padding: 12px; display: grid; gap: 10px; }
  legend { font: 12px ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; padding: 0 6px; }
</style>
</head>
<body>
  <header><b>NOT</b><nav><button class="ic" id="selbtn" aria-label="Seç" title="Seç"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg></button><button class="ic" id="sync" aria-label="Senkronla" title="Senkronla"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 9A8 8 0 0 0 5 7.5M4.5 15A8 8 0 0 0 19 16.5"/><path d="M5 3.5v4h4M19 20.5v-4h-4"/></svg></button><button class="ic" id="gear" aria-label="Ayarlar" title="Ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg></button></nav></header>

  <main class="stage">
    <button id="rec" aria-label="Kaydı başlat / durdur"><span class="mono">KAYIT</span></button>
    <div id="status" role="status" aria-live="polite"></div>
    <button id="mark" aria-label="Bu anı önemli diye işaretle">İşaret koy</button>
  </main>

  <input id="q" type="search" placeholder="Notlarda ara" aria-label="Notlarda ara">
  <div id="list"></div>
  <datalist id="courses"></datalist>
  <div id="selbar"><span class="mono">0 seçili</span><button id="selall" class="ghost">Tümü</button><button id="selcancel" class="ghost">Vazgeç</button><button id="seldel">Sil</button></div>

  <dialog id="detail">
    <div class="dbody" id="detail-body"></div>
    <div class="bar">
      <button class="ic" id="close" aria-label="Kapat" title="Kapat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="ic push" id="edit" aria-label="Düzenle" title="Düzenle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
      <button class="ic" id="share" aria-label="Paylaş" title="Paylaş"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg></button>
      <button class="ic" id="retry" aria-label="Tekrar dene" title="Tekrar dene"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8L4 8.5"/><path d="M4 4v4.5h4.5"/></svg></button>
      <button class="ic" id="del" aria-label="Sil" title="Sil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg></button>
    </div>
  </dialog>

  <dialog id="settings">
    <form method="dialog" class="dbody">
      <h2>Ayarlar</h2>
      <p id="settings-msg" class="err" style="border:0;padding:0"></p>
      <label>Groq API anahtarı
        <input id="groqKey" type="password" autocomplete="off" placeholder="gsk_…"></label>
      <p class="hint">Ücretsiz: <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a></p>
      <label>GitHub anahtarı (Obsidian sync)
        <input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…"></label>
      <label>Not deposu
        <input id="ghRepo" autocomplete="off" placeholder="kullanici/voice-notes"></label>
      <fieldset><legend>Notion (isteğe bağlı)</legend>
        <label>Notion anahtarı <input id="notionToken" type="password" autocomplete="off" placeholder="ntn_…"></label>
        <label>Veritabanı kimliği <input id="notionDb" autocomplete="off" placeholder="32 karakterlik kimlik"></label>
        <label>Aracı adresi (Cloudflare Worker) <input id="notionProxy" autocomplete="off" placeholder="https://…workers.dev"></label>
      </fieldset>
      <p class="hint">Anahtarlar yalnızca bu cihazda saklanır.</p>
      <fieldset><legend>Yedek</legend>
        <button id="export">Tüm notları ve sesleri indir</button>
        <label>Yedekten geri yükle <input id="import" type="file" accept="application/json,.json"></label>
      </fieldset>
      <div class="bar" style="padding:12px 0 0"><button id="save">Kaydet</button><button value="cancel" formnovalidate>Vazgeç</button></div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
